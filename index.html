    <!-- 排程通知功能 -->
    <script>
        var m_scheduleTimer = null;
        var m_scheduleProcessTime = new Date(new Date().getTime() - 60 * 1000);     // 設定最後處理時間為一分鐘前，以確保一開始就可以 Run

        function initialSchedule() {

            // 每一秒跑一次, 以正確更新時間
            var dt = 1 * 1000;
            m_scheduleTimer = window.setInterval(scheduleTimer_OnTick, dt);
        }

        initialSchedule();

        function scheduleTimer_OnTick() {

            // 顯示現在時間
            var nowTime = appHelper.dateToHHMMSS(new Date());            
            $("#nowLabel").text(nowTime);

            // 兩次處理間隔要超過 30 秒
            var deltaSecond = (new Date().getTime() - m_scheduleProcessTime.getTime()) / 1000;
            if (deltaSecond < 30)
                return;

            m_scheduleProcessTime = new Date(); // 紀錄最後處理時間

            // 載入設定
            var savePackage = appHelper.loadStockPackage();

            if (typeof (savePackage.scheduleList) == "undefined" && savePackage.scheduleList == null || savePackage.scheduleList.length <= 0)
                return;

            var isTrigger = false;
            for (var i = 0; i < savePackage.scheduleList.length; i++) {
                var item = savePackage.scheduleList[i];

                var b = appHelper.checkNotifyTrigger(new Date, item.triggerTime, item.lastTriggerTime);

                if (b == false)
                    continue;

                appHelper.showNotify(item.itemName + "(" + item.triggerTime + ")", item.itemText, item.autoClose);

                console.log("showNotify at " + (new Date()).toString());
                console.log("itemName: " + item.itemName + "\r\nitemText: " + item.itemText + "\r\nautoClose: " + item.autoClose)

                item.lastTriggerTime = new Date();

                isTrigger = true;
            }

            if (isTrigger == true) {
                appHelper.saveStockPackage(savePackage);
                console.log("Notify trigger, save package.");
            }
        }

    </script>




    <!-- 標題輪播功能 -->
    <script>
        var m_flashTimer = null;
        var m_flashIndex = 0;

        function initialFlash() {

            var dt = 10 * 1000; // 10 sec
            m_flashTimer = window.setInterval(flashTimer_OnTick, dt);
        }

        initialFlash();

        function flashTimer_OnTick() {
            var carouselCheckBox = document.getElementById("carouselCheckBox");

            var b = carouselCheckBox.checked;
            if (b == false) {
                return;
            }
            
            var oldStockPackage = appHelper.loadStockPackage();
            if (oldStockPackage == null || typeof (oldStockPackage.data) == "undefined")
                return;

            // 輪播順序
            // 0 => 第 0 個訂閱 Ex: "0050▽3.80%"
            // 1 => 第 1 個訂閱
            // ....
            // Count-1 => 最後一個訂閱
            // Count => NOW  Ex: "11:41:52"
            // ps. 每十秒輪播一個 Item

            var txt = "";

            // Count => NOW
            if (m_flashIndex == oldStockPackage.data.length) {
                txt = formatTimeHHMM(new Date());
            }

            // 0 ~ Count-1 => Display StockId + deltaPriceRate
            if (m_flashIndex >= 0 && m_flashIndex < oldStockPackage.data.length) {

                var oldItem = oldStockPackage.data[m_flashIndex];

                var stockId = oldItem.stockId;
                var previousClosePrice = oldItem.previousClosePrice;
                var currentPrice = previousClosePrice;

                if (oldItem.currentPrice != "")
                    currentPrice = oldItem.currentPrice;

                var deltaPrice = currentPrice - previousClosePrice;
                var deltaPriceRate = deltaPrice / previousClosePrice;

                var deltaFlag = "－";
                if (deltaPrice > 0)
                    deltaFlag = "▲";
                if (deltaPrice < 0)
                    deltaFlag = "▽";

                txt += "" + stockId;

                txt += deltaFlag + (deltaPriceRate * 100).toFixed(2) + "%";
            }

            // 更新 Title
            document.title = txt;

            console.log("TITLE: " + txt + ", at " + (new Date()).toString());

            m_flashIndex++;

            if (m_flashIndex > oldStockPackage.data.length) {
                m_flashIndex = 0;
            }

        }


        function carouselCheckBox_OnChange() {

            var carouselCheckBox = document.getElementById("carouselCheckBox");
            var b = carouselCheckBox.checked;
            if (b == true) {
                m_flashIndex = 0;
                flashTimer_OnTick();
                console.log("CAROUSEL ON");

                // 啟動靜音音訊防止主執行緒因為節流的關係被暫停
                startNonSilentAudio();
            }
            else {
                document.title = "Stock";
                console.log("CAROUSEL OFF");

                // 停止靜音訊，以釋放資源
                stopBackgroundTasks();
            }            
        }
    </script>



    <script>

        var m_downCountTimer = null;
        var m_counter = 0;

        function initialForm() {
            var responseArea = document.getElementById("responseArea");

            var oldStockPackage = appHelper.loadStockPackage();
            console.log("Initial data.");
            console.log(oldStockPackage);

            // 載入最後輸入的清單

                }
            }


            responseArea.value = "No data, please read new data."


            if (oldStockPackage != null) {
                if (typeof (oldStockPackage.lastTime) != "undefined") {
                    responseArea.value = "上次資料取時間: " + oldStockPackage.lastTime;
                }

                // 載入自動更新設定                
                if (typeof (oldStockPackage.autoUpdate) != "undefined") {
                    var updateTickSelect = document.getElementById("updateTickSelect");
                    updateTickSelect.value = oldStockPackage.autoUpdate;
                    console.log("load autoUpdate=" + oldStockPackage.autoUpdate);
                }              
            }

            m_downCountTimer = window.setInterval(downCountTimerProc, 1000);
        }

        initialForm();

        function downCountTimerProc() {

            m_counter--;

            // 如果 1 => 0 則讀取最新資料
            if (m_counter == 0) {
                console.log("計數耗盡讀取資料, 於 " + (new Date()).toString());
                readStock();
            }

            // 如果小於 0 則重設現在選擇的計數
            var updateTickSelect = document.getElementById("updateTickSelect");
            var tick = parseInt(updateTickSelect.value, 10);

            if (m_counter < 0) {
                m_counter = tick;
            }

            // 顯示現在的 Counter
            var counterLabel = document.getElementById("counterLabel");
            counterLabel.innerHTML = "" + m_counter;
        }

        function updateTickSelect_OnChange() {

            // 重設 Counter
            var updateTickSelect = document.getElementById("updateTickSelect");
            var tick = parseInt(updateTickSelect.value, 10);

            m_counter = tick;


            // 儲存自動更新參數
            var savedData = appHelper.loadStockPackage();
            if (savedData == null)
                savedData = {};

            savedData.autoUpdate = tick;
            appHelper.saveStockPackage(savedData);

            console.log("AutoUpdate=" + tick);
        }

        function copyResult() {

            var copyLabel = document.getElementById("copyLabel");
            copyLabel.innerText = "輸出已複製, 於:" + formatDateTime(new Date());

        function readStock() {

            // 將輸入參數轉成 SockId Array, 讀取最新資料, 並顯示最新行情
            var twStockText = document.getElementById("twStockTextBox").value;
            var stockQText = document.getElementById("stockQTextBox").value;

            if (twStockText == '' && stockQText == '') {
                alert("請輸入 TwStock 或者 StockQ 的 StockId, 若有多筆請用逗號分隔 !");
                return;
            }

            // 字串轉成 Array
            var twStockItems = twStockText.split(",");
            var twStockIdList = [];
            for (var i = 0; i < twStockItems.length; i++) {
                var stockId = twStockItems[i].trim();
                twStockIdList.push(stockId);
            }

            var stockQItems = stockQText.split(",");
            var stockQIdList = [];
            for (var i = 0; i < stockQItems.length; i++) {
                var stockId = stockQItems[i].trim();
                stockQIdList.push(stockId);
            }

            var responseArea = document.getElementById("responseArea");

            var oldStockPackage = appHelper.loadStockPackage(); // 讀取上次的儲存結果

            responseArea.value = "Read Stock ... " + twStockIdList.join(",") + " " +stockQIdList.join(",");

            fetchStockData(twStockIdList, stockQIdList, function (error, stockData) {
                if (error) {
                    // 顯示錯誤訊息
                    responseArea.value = "錯誤：" + error.message;
                    console.log(error);
                } else {

                    console.log(stockData);
                                        
                    var o = stockData;

                    var str = "";
                    for (var i = 0; i < stockData.length; i++) {
                        var dataItem = stockData[i];

                        // 單筆資料
                        //{
                        //    "dataSource": "TwStock",
                        //    "stockId": "2330",
                        //    "stockName": "台積電",
                        //    "currentPrice": 1760,
                        //    "previousClosePrice": 1785
                        //}

                                                                      
                        // 讀取上一次的 Stock 資料
                        var oldItem = null;
                        if (typeof (oldStockPackage) != "undefined" && oldStockPackage != null && typeof (oldStockPackage.data) != "undefined") {

                            // 找出相符的 Item
                            for (var j = 0; j < oldStockPackage.data.length; j++) {
                                var oldDataItem = oldStockPackage.data[j];
                                if (oldDataItem.dataSource == dataItem.dataSource && oldDataItem.stockId == dataItem.stockId) {
                                    oldItem = oldDataItem;
                                    break;
                                }
                            }                            
                        }

                        var stockText = StockToText(dataItem, oldItem);

                        if ($("#simpleCheckBox").prop("checked") == false) {
                            str += stockText;
                            str += "\r\n------------------------------";
                            str += "\r\n";
                        }
                        else {
                            // 精簡輸出，不需要橫線
                            str += stockText;
                            str += "\r\n";
                        }

                    }

                    if (oldStockPackage != null && typeof (oldStockPackage.lastTime) != "undefined") {

                        var nowTime = formatDateTime(new Date());
                        var elapse = calculateTimeDifference(oldStockPackage.lastTime, new Date());

                        str += "\r\n讀取: " + nowTime + " (經過: " + elapse + ")";
                    }

                    responseArea.value = str;

                    // 儲存最後一次查詢
                    if (oldStockPackage == null)
                        oldStockPackage = {};

                    oldStockPackage.twStockIdList = twStockIdList;
                    oldStockPackage.stockQIdList = stockQIdList;
                    oldStockPackage.lastTime = new Date();
                    oldStockPackage.data = o;

                    appHelper.saveStockPackage(oldStockPackage);
                    console.log("StockPackage saved. at " + (new Date).toString());
                }
            });

            // Output:
            // UP => ▲
            // DOWN => ▽
            // DRAW => －
            // 《2330 台積電》
            // 目前: 1475.000 (▲ 10.0000) (0.6849%)
            // 漲跌: ▲ 15.0000 (1.0273%)
        }





        function StockToText(item, oldItem) {
            // 《2330 台積電》
            // 目前: 1475.000 (▲ 10.0000) (0.6849%)
            // 漲跌: ▲ 15.0000 (1.0273%)


            var txt = "";

            // 《2330 台積電》
            txt += "《" + item.stockId;
            if (item.stockName != "" && item.stockId != item.stockName)
                txt += " " + item.stockName;
            txt += "》";


            // 如果沒有上一次資料
            // 目前: 1475.000 (－ 0.0000) (0.0000%)
            if (typeof (oldItem) == "undefined" || oldItem == null) {
                txt += "\r\n";
                txt += "目前: " + item.currentPrice.toFixed(4);
                txt += " (－ 0.0000) (0.0000%)";
            }

            // 目前: 1475.000 (▲ 10.0000) (0.6849%)
            if (oldItem != null) {

                var previousPrice = oldItem.currentPrice;
                
                var deltaPrice = item.currentPrice - previousPrice;

                var deltaPriceFlag = "－";
                if (deltaPrice > 0)
                    deltaPriceFlag = "▲";
                if (deltaPrice < 0)
                    deltaPriceFlag = "▽";

                txt += "\r\n";
                txt += "目前: " + item.currentPrice.toFixed(4);
                txt += " (" + deltaPriceFlag + " " + deltaPrice.toFixed(4) + ")";
                txt += " (" + ((deltaPrice / previousPrice) * 100).toFixed(4) + "%" + ")";
            }

            // 漲跌: ▲ 15.0000 (1.0273%)

            console.log(item);

            var deltaPreviousPrice = item.currentPrice - item.previousClosePrice;
            var deltaRatePeviousPrice = deltaPreviousPrice / item.previousClosePrice;
            var deltaPreviousPriceFlag = "－";
            if (deltaPreviousPrice > 0)
                deltaPreviousPriceFlag = "▲";
            if (deltaPreviousPrice < 0)
                deltaPreviousPriceFlag = "▽";

            txt += "\r\n";
            txt += "漲跌: " + deltaPreviousPriceFlag;
            txt += " " + deltaPreviousPrice.toFixed(4);
            txt += " (" + (deltaRatePeviousPrice * 100).toFixed(4) + "%)";

            // 如果使用精簡輸出
            // 00631L: 29.520 ▽-0.100(-0.33%) 
            if ($("#simpleCheckBox").prop("checked") == true) {
                txt = item.stockId + ": ";
                txt += item.currentPrice.toFixed(3);
                txt += deltaPreviousPriceFlag;
                txt += " " + deltaPreviousPrice.toFixed(3);
                txt += " (" + (deltaRatePeviousPrice * 100).toFixed(2) + "%)";
            }


            return txt;
        }


    </script>



    <!-- 資料來源 讀取功能 -->
    <script>

        async function fetchStockData(twstockIdList, stockqIdList, callback) {

            // callback(err, stockData)

            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            const twstockUrl = isLocalhost 
                ? 'http://localhost:3000/api/twstock' 
                : 'https://stockv.onrender.com/api/twstock';

            const stockqUrl = isLocalhost 
                ? 'http://localhost:3000/api/stockq' 
                : 'https://stockv.onrender.com/api/stockq';
            

            var resultList = [];
            
            //========== 讀取 TwStock ==========
            console.log("Read TwStock , url=" + twstockUrl);

            var err = null;            
            if(twstockIdList != null && twstockIdList.length > 0) {
                var twstockResultJo = {};   // 預設返回值

                var twstockPostJo = { 
                    stockIdList:twstockIdList 
                };            

                try {
                    // 使用 await 等待 fetch 回應
                    const response = await fetch(twstockUrl, {
                    method: 'POST', // 設定 HTTP 方法為 POST
                    headers: {
                        'Content-Type': 'application/json' // 告訴伺服器我們傳送的是 JSON 格式
                    },
                    body: JSON.stringify(twstockPostJo) // 將 JavaScript 物件轉換成 JSON 字串
                    });

                    // 檢查 HTTP 狀態碼是否成功 (200-299)
                    if (!response.ok) {
                        console.log(`fetchStockData(): TwStock HTTP 錯誤！狀態碼：${response.status}`);
                        err = `fetchStockData(): TwStock HTTP 錯誤！狀態碼：${response.status}`;
                    }
                    else {
                        // 使用 await 等待回應內容被解析為 JSON 物件
                        const resultJson = await response.json();
                        twstockResultJo = resultJson.data;
                    }                
                } catch (error) {
                    console.error('請求失敗：', error);
                    err = '請求失敗：' + error;
                }

                // 存入結果
                for(var i = 0 ; i < twstockIdList.length; i++) {
                    var stockId = twstockIdList[i];
                    var stockType = twstockResultJo[stockId].stockType;
                    var stockName = twstockResultJo[stockId].stockName;
                    var currentPrice = twstockResultJo[stockId].currentPrice;
                    var previousClosePrice = twstockResultJo[stockId].previousClosePrice;
                    resultList.push({
                        dataSource: stockType,
                        stockId: stockId,
                        stockName: stockName,
                        currentPrice: currentPrice,
                        previousClosePrice: previousClosePrice                        
                    });
                }
            }

            //========== 讀取 StockQ ==========
            console.log("Read StockQ , url=" + stockqUrl);

            
            if(stockqIdList != null && stockqIdList.length > 0) {
                var stockqResultJo = {};   // 預設返回值

                var stockqPostJo = { 
                    stockIdList: stockqIdList 
                };            

                try {
                    // 使用 await 等待 fetch 回應
                    const response = await fetch(stockqUrl, {
                    method: 'POST', // 設定 HTTP 方法為 POST
                    headers: {
                        'Content-Type': 'application/json' // 告訴伺服器我們傳送的是 JSON 格式
                    },
                    body: JSON.stringify(stockqPostJo) // 將 JavaScript 物件轉換成 JSON 字串
                    });

                    // 檢查 HTTP 狀態碼是否成功 (200-299)
                    if (!response.ok) {
                        console.log(`fetchStockData(): StockQ HTTP 錯誤！狀態碼：${response.status}`);
                        err = `fetchStockData(): StockQ HTTP 錯誤！狀態碼：${response.status}`;
                    }
                    else {
                        // 使用 await 等待回應內容被解析為 JSON 物件
                        const resultJson = await response.json();
                        stockqResultJo = resultJson.data;
                    }                
                } catch (error) {
                    console.error('請求失敗：', error);                
                    err = '請求失敗：' + error;
                }

                 // 存入結果
                for(var i = 0 ; i < stockqIdList.length; i++) {
                    var stockId = stockqIdList[i];
                    var stockType = stockqResultJo[stockId].stockType;
                    var stockName = stockqResultJo[stockId].stockName;
                    var currentPrice = stockqResultJo[stockId].currentPrice;
                    var previousClosePrice = stockqResultJo[stockId].previousClosePrice;
                    resultList.push({
                        dataSource: stockType,
                        stockId: stockId,
                        stockName: stockName,
                        currentPrice: currentPrice,
                        previousClosePrice: previousClosePrice                        
                    });
                }
            }

            // 呼叫 callback
            if(callback != null) {
                callback(err, resultList);
            }

            return resultList;
        }



        function fetchStockData_OLD(twStockIdList, stockQIdList, callback) {

            // 產生 URL 
            // allstock.aspx?tw=t00|2330|0050&q=美元/台幣|道瓊工業|黃金
            var url = "allstock.aspx?tw=";
            if (twStockIdList.length > 0) {                
                for (var i = 0; i < twStockIdList.length; i++) {
                    if (i > 0) {
                        url += "|";
                    }
                    url += twStockIdList[i];
                }
            }

            url += "&q=";
            if (stockQIdList.length > 0) {                
                for (var i = 0; i < stockQIdList.length; i++) {
                    if (i > 0) {
                        url += "|";
                    }
                    url += encodeURI(stockQIdList[i]);      // StockQ 多是中文，需要編碼
                }
            }
            url += "&_=" + (new Date()).getTime();

            console.log("Read stock , url=" + url);

            // 1. 建立 XMLHttpRequest 物件
            const xhr = new XMLHttpRequest();

            // 2. 初始化請求：指定方法為 GET，目標 URL
            xhr.open('GET', url);

            // 3. 設定響應類型 (可選，但有助於某些 API)
            // 這裡我們不設定，讓它預設為文本

            // 4. 定義狀態改變時的回調函數
            xhr.onreadystatechange = function () {
                // 檢查請求是否完成 (readyState === 4)
                if (xhr.readyState === 4) {
                    // 檢查 HTTP 狀態碼是否成功 (200-299 範圍內通常視為成功)
                    if (xhr.status >= 200 && xhr.status < 300) {
                        // 請求成功
                        // 使用 callback 回傳 null (表示沒有錯誤) 和 響應文本

                        var json = xhr.responseText;

                        var stockData = JSON.parse(json);

                        callback(null, stockData);
                    } else {
                        // 請求失敗 (例如 404 Not Found, 500 Server Error)
                        const error = new Error(`HTTP 請求失敗，狀態碼: ${xhr.status}`);
                        // 使用 callback 回傳 Error 物件 和 null (表示沒有內容)
                        callback(error, null);
                    }
                }
            };

            // 5. 定義網路層次的錯誤處理 (例如，連線中斷、DNS 錯誤等)
            xhr.onerror = function () {
                const error = new Error("網路請求發生錯誤或無法連線到伺服器。");
                callback(error, null);
            };

            // 6. 發送請求
            xhr.send();
        }




    </script>

    <script>
        function formatDateTime(dateObj) {
            // 檢查輸入是否為有效的 Date 物件
            if (!(dateObj instanceof Date) || isNaN(dateObj)) {
                return "Invalid Date";
            }

            // 輔助函式：確保數字是兩位數，不足則前面補零
            const padToTwoDigits = (num) => {
                return num.toString().padStart(2, '0');
            };

            // 取得各個日期時間部分
            const year = dateObj.getFullYear();
            // getMonth() 回傳 0-11，所以需要 +1
            const month = padToTwoDigits(dateObj.getMonth() + 1);
            const day = padToTwoDigits(dateObj.getDate());
            const hours = padToTwoDigits(dateObj.getHours());
            const minutes = padToTwoDigits(dateObj.getMinutes());
            const seconds = padToTwoDigits(dateObj.getSeconds());

            // 組合成目標格式字串
            return `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
        }

        function calculateTimeDifference(date1, date2) {
            // 1. 檢查輸入是否為有效的 Date 物件
            if (!(date1 instanceof Date) || isNaN(date1) || !(date2 instanceof Date) || isNaN(date2)) {
                return "Invalid Input";
            }

            // 2. 計算毫秒差 (使用 Math.abs 確保結果為正數，代表絕對時間差)
            const diffInMilliseconds = Math.abs(date1.getTime() - date2.getTime());

            // 3. 轉換為總秒數
            // 1000 毫秒 = 1 秒
            const totalSeconds = Math.floor(diffInMilliseconds / 1000);

            // 4. 進行時、分、秒的計算
            const seconds = totalSeconds % 60;
            const totalMinutes = Math.floor(totalSeconds / 60);
            const minutes = totalMinutes % 60;
            const hours = Math.floor(totalMinutes / 60); // 小時數可能會超過 24

            // 5. 輔助函式：確保數字是兩位數，不足則前面補零
            const padToTwoDigits = (num) => {
                return num.toString().padStart(2, '0');
            };

            // 6. 組合並輸出格式字串
            // 注意：小時數 (hours) 雖然在 HH:mm:ss 格式中，但如果時間差超過 24 小時，它會顯示超過 24 的數字。
            // 例如：50 小時 00 分 00 秒 => "50:00:00"
            return `${padToTwoDigits(hours)}:${padToTwoDigits(minutes)}:${padToTwoDigits(seconds)}`;
        }



        let audioCtx = null;

        function startNonSilentAudio() {
            if (!window.AudioContext && !window.webkitAudioContext) return;

            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // 1. 建立一個振盪器 (OscillatorNode) 來生成聲音
                const oscillator = audioCtx.createOscillator();
                // 🚨 修正點：使用一個極低頻率 (例如 20 Hz)，人耳通常難以察覺
                oscillator.type = 'sine'; // 正弦波
                oscillator.frequency.setValueAtTime(20, audioCtx.currentTime);

                // 2. 建立增益節點 (Gain Node) 來控制音量
                const gainNode = audioCtx.createGain();
                // 🚨 修正點：維持一個極低但非零的音量 (0.005 或 0.01)
                gainNode.gain.setValueAtTime(0.005, audioCtx.currentTime);

                // 3. 連接節點: 振盪器 -> 增益 -> 目的地
                oscillator.connect(gainNode).connect(audioCtx.destination);

                // 4. 開始播放
                oscillator.start(0);

                console.log("非靜音音頻 (20Hz) 已啟動，嘗試防止計時器節流。");
            }

            // 在使用者互動時，確保 Context 狀態為 running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    console.log("AudioContext 已從 suspended 狀態恢復 (resume)。");
                }).catch(err => {
                    console.error("AudioContext 恢復失敗:", err);
                });
            }
        }

        function stopBackgroundTasks() {                
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
                console.log("背景音頻已停止並釋放資源。");
            }
        }
    </script>
