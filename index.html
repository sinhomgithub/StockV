<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockV | 全新股市觀察軟體即將登場</title>
    <!-- 引入 Google 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景裝飾光晕 */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: #9ca3af;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .feature-box {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            text-align: left;
        }

        .feature-box h3 {
            color: #ffffff;
            font-size: 1.25rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-box h3 span {
            color: #34d399;
        }

        .feature-box p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="email"] {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            font-size: 1rem;
            width: 280px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            border-color: #34d399;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: #10b981;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #4b5563;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }
            p.subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <span class="badge">🚀 敬請期待</span>
        <h1>Welcome</h1>
        <p class="subtitle">全新一代智慧股市觀察軟體功能，StockV 即將震撼誕生。</p>

        <div class="feature-box">
            <h3><span>📈</span> 洞察先機，精準掌握市場脈動</h3>
            <p>我們正在打造一套專為現代投資人設計的強大看盤工具。結合即時數據流、深度趨勢分析與極致流暢的操作介面，助您在瞬息萬變的股市中精準佈局，搶佔先機。</p>
        </div>

        <div class="cta-group">
            <input type="email" placeholder="輸入您的 Email 接收上線通知" />
            <button onclick="alert('感謝您的訂閱！我們將在軟體上線時第一時間通知您。')">搶先卡位</button>
        </div>

        <footer>
            &copy; 2026 Stock Insight Project. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
