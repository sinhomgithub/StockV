    <!-- 標題輪播功能 -->
    <script>
        var m_flashTimer = null;
        var m_flashIndex = 0;

        function initialFlash() {

            var dt = 10 * 1000; // 10 sec
            m_flashTimer = window.setInterval(flashTimer_OnTick, dt);
        }

        initialFlash();

        function flashTimer_OnTick() {
            var carouselCheckBox = document.getElementById("carouselCheckBox");

            var b = carouselCheckBox.checked;
            if (b == false) {
                return;
            }


            var oldStockPackage = loadStockPackage();
            if (oldStockPackage == null || typeof (oldStockPackage.stockIdList) == "undefined")
                return;

            // 輪播順序
            // 0 => 第 0 個訂閱 Ex: "0050▽3.80%"
            // 1 => 第 1 個訂閱
            // ....
            // Count-1 => 最後一個訂閱
            // Count => NOW  Ex: "11:41:52"
            // ps. 每十秒輪播一個 Item



            var txt = "";

            // Count => NOW
            if (m_flashIndex == oldStockPackage.stockIdList.length) {
                txt = formatTimeHHMM(new Date());
            }

            // 0 ~ Count-1 => Display StockId + deltaPriceRate
            if (m_flashIndex >= 0 && m_flashIndex < oldStockPackage.stockIdList.length) {

                var stockId = oldStockPackage.stockIdList[m_flashIndex];
                var oldItem = oldStockPackage.data[stockId];

                var previousClosePrice = oldItem.previousClosePrice;
                var currentPrice = previousClosePrice;

                if (oldItem.currentPrice != "")
                    currentPrice = oldItem.currentPrice;

                var deltaPrice = currentPrice - previousClosePrice;
                var deltaPriceRate = deltaPrice / previousClosePrice;

                var deltaFlag = "－";
                if (deltaPrice > 0)
                    deltaFlag = "▲";
                if (deltaPrice < 0)
                    deltaFlag = "▽";

                txt += "" + stockId;

                txt += deltaFlag + (deltaPriceRate * 100).toFixed(2) + "%";
            }

            // 更新 Title
            document.title = txt;

            console.log("TITLE: " + txt + ", at " + (new Date()).toString());

            m_flashIndex++;

            if (m_flashIndex > oldStockPackage.stockIdList.length) {
                m_flashIndex = 0;
            }

        }


        function carouselCheckBox_OnChange() {

            var carouselCheckBox = document.getElementById("carouselCheckBox");
            var b = carouselCheckBox.checked;
            if (b == true) {
                m_flashIndex = 0;
                flashTimer_OnTick();
                console.log("CAROUSEL ON");

                // 啟動靜音音訊防止主執行緒因為節流的關係被暫停
                startNonSilentAudio();
            }
            else {
                document.title = "Stock";
                console.log("CAROUSEL OFF");

                // 停止靜音訊，以釋放資源
                stopBackgroundTasks();
            }
       
        }
    </script>

    <script>

        var m_downCountTimer = null;
        var m_counter = 0;

        function initialForm() {
            var responseArea = document.getElementById("responseArea");

            var oldStockPackage = loadStockPackage();
            console.log("Initial data.");
            console.log(oldStockPackage);

            // 載入最後輸入的清單
            if (oldStockPackage != null && typeof (oldStockPackage.stockIdList) != "undefined") {
                var txt = oldStockPackage.stockIdList.join(",");
                document.getElementById("stockIdInput").value = txt;
            }


            responseArea.value = "No data, please read new data."


            if (oldStockPackage != null) {
                if (typeof (oldStockPackage.lastTime) != "undefined") {
                    responseArea.value = "上次資料取時間: " + oldStockPackage.lastTime;
                }

                // 載入自動更新設定
                var updateTickSelect = document.getElementById("updateTickSelect");
                if (typeof (oldStockPackage.autoUpdate) != "undefined") {
                    updateTickSelect.value = oldStockPackage.autoUpdate;
                    console.log("load autoUpdate=" + oldStockPackage.autoUpdate);
                }

            }

            m_downCountTimer = window.setInterval(downCountTimerProc, 1000);
        }

        initialForm();

        function downCountTimerProc() {

            m_counter--;

            // 如果 1 => 0 則讀取最新資料
            if (m_counter == 0) {
                console.log("計數耗盡讀取資料, 於 " + (new Date()).toString());
                readStock();
            }

            // 如果小於 0 則重設現在選擇的計數
            var updateTickSelect = document.getElementById("updateTickSelect");
            var tick = parseInt(updateTickSelect.value, 10);

            if (m_counter < 0) {
                m_counter = tick;
            }

            // 顯示現在的 Counter
            var counterLabel = document.getElementById("counterLabel");
            counterLabel.innerHTML = "" + m_counter;
        }

        function updateTickSelect_OnChange() {

            // 重設 Counter
            var updateTickSelect = document.getElementById("updateTickSelect");
            var tick = parseInt(updateTickSelect.value, 10);

            m_counter = tick;


            // 儲存自動更新參數
            var savedData = loadStockPackage();
            if (savedData == null)
                savedData = {};

            savedData.autoUpdate = tick;
            saveStockPackage(savedData);

            console.log("AutoUpdate=" + tick);
        }

        function copyResult() {

            var responseArea = document.getElementById("responseArea");
            responseArea.select();
            document.execCommand('copy');

            var copyLabel = document.getElementById("copyLabel");
            copyLabel.innerText = "輸出已複製, 於:" + formatDateTime(new Date());
        }


        function readStock() {

            var inputText = document.getElementById("stockIdInput").value;

            if (inputText == '') {
                alert("請輸入 StockId ,若有多筆請用逗號分隔. (Ex: t00,0050,0052) ");
                return;
            }

            // 字串轉成 Array
            var items = inputText.split(",");
            var stockIdList = [];

            for (var i = 0; i < items.length; i++) {
                var stockId = items[i].trim();
                stockIdList.push(stockId);
            }

            var responseArea = document.getElementById("responseArea");

            var oldStockPackage = loadStockPackage(); // 讀取上次的儲存結果

            responseArea.value = "Read Stock ... " + stockIdList.join(",");

            fetchStockData(stockIdList, function (error, stockData) {
                if (error) {
                    // 顯示錯誤訊息
                    responseArea.value = `錯誤：${error.message}`;
                    console.log(error);
                } else {

                    console.log(stockData);

                    var o = stockData;

                    var str = "";
                    for (var i = 0; i < stockIdList.length; i++) {
                        var stockId = stockIdList[i];
                        var stockObject = o[stockId];

                        // 跳過無效的代碼
                        if (typeof (stockObject) == "undefined" || stockObject == null)
                            continue;

                        // 讀取上一次的 Stock 資料
                        var oldItem = null;
                        if (typeof (oldStockPackage) != "undefined" && oldStockPackage != null && typeof (oldStockPackage.data) != "undefined")
                            oldItem = oldStockPackage.data[stockId];

                        var stockText = StockToText(o[stockId], oldItem);
                        str += stockText;
                        str += "\r\n";
                        str += "------------------------------------\r\n";      // 加上分隔線
                    }

                    if (oldStockPackage != null && typeof (oldStockPackage.lastTime) != "undefined") {

                        var nowTime = formatDateTime(new Date());
                        var elapse = calculateTimeDifference(oldStockPackage.lastTime, new Date());

                        str += "\r\n讀取: " + nowTime + " (經過: " + elapse + ")";
                    }

                    responseArea.value = str;

                    // 儲存最後一次查詢
                    if (oldStockPackage == null)
                        oldStockPackage = {};

                    oldStockPackage.stockIdList = stockIdList;
                    oldStockPackage.lastTime = new Date();
                    oldStockPackage.data = o;

                    saveStockPackage(oldStockPackage);
                    console.log("StockPackage saved. at " + (new Date).toString());
                }
            });

            // Output:
            // UP => ▲
            // DOWN => ▽
            // DRAW => －
            // 《2330 台積電》
            // 目前: 1475.000 (▲ 10.0000) (0.6849%)
            // 漲跌: ▲ 15.0000 (1.0273%)
        }





        function StockToText(item, oldItem) {
            // 《2330 台積電》
            // 目前: 1475.000 (▲ 10.0000) (0.6849%)
            // 漲跌: ▲ 15.0000 (1.0273%)


            var txt = "";

            // 《2330 台積電》
            txt += "《" + item.stockId;
            if (item.name != "")
                txt += " " + item.stockName;
            txt += "》";


            // 目前: 1475.000 (▲ 10.0000) (0.6849%)
            var currentPrice = item.currentPrice;
            if (currentPrice == "" || item.highPrice == "")
                item.currentPrice = item.previousClosePrice;    // 如果沒有現在價格, 或者沒有高低價格, 代表未開盤，直接使用收盤價

            if (typeof (oldItem) == "undefined" || oldItem == null) {
                txt += "\r\n";
                txt += "目前: " + item.currentPrice.toFixed(4);
                txt += " (－ 0.0000) (0.0000%)";
            }


            if (oldItem != null) {

                var previousPrice = oldItem.currentPrice;
                if (previousPrice == "" || oldItem.highPrice == "")
                    previousPrice = oldItem.previousClosePrice;     // 取得上次價格 (沒有現在價格或者沒有高低價格, 代表未開盤, 直接使用收盤價)

                var deltaPrice = item.currentPrice - previousPrice;

                var deltaPriceFlag = "－";
                if (deltaPrice > 0)
                    deltaPriceFlag = "▲";
                if (deltaPrice < 0)
                    deltaPriceFlag = "▽";

                txt += "\r\n";
                txt += "目前: " + item.currentPrice.toFixed(4);
                txt += " (" + deltaPriceFlag + " " + deltaPrice.toFixed(4) + ")";
                txt += " (" + ((deltaPrice / previousPrice) * 100).toFixed(4) + "%" + ")";
            }

            // 漲跌: ▲ 15.0000 (1.0273%)

            var deltaPreviousPrice = item.currentPrice - item.previousClosePrice;
            var deltaRatePeviousPrice = deltaPreviousPrice / item.previousClosePrice;
            var deltaPreviousPriceFlag = "－";;
            if (deltaPreviousPrice > 0)
                deltaPreviousPriceFlag = "▲";
            if (deltaPreviousPrice < 0)
                deltaPreviousPriceFlag = "▽";

            txt += "\r\n";
            txt += "漲跌: " + deltaPreviousPriceFlag;
            txt += " " + deltaPreviousPrice.toFixed(4);
            txt += " (" + (deltaRatePeviousPrice * 100).toFixed(4) + "%)";


            return txt;
        }


    </script>



    <!-- Stock 讀取功能 -->
    <script>
        function fetchStockData(stockIdList, callback) {

            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            const API_URL = isLocalhost 
            ? 'http://localhost:3000/api/twstock' 
            : 'https://stockv.onrender.com/api/twstock';

            console.log('目前使用的 API 網址：', API_URL);

            var url = API_URL;

            var postData = {
                stockIdList: stockIdList
            };

            console.log("Read stock , url=" + url);

            // 1. 建立 XMLHttpRequest 物件
            const xhr = new XMLHttpRequest();
            
            // 2. 初始化請求：指定方法為 POST，目標 URL
            xhr.open('POST', url);

            xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

            // 3. 設定響應類型 (可選，但有助於某些 API)
            // 這裡我們不設定，讓它預設為文本

            // 4. 定義狀態改變時的回調函數
            xhr.onreadystatechange = function () {
                // 檢查請求是否完成 (readyState === 4)
                if (xhr.readyState === 4) {
                    // 檢查 HTTP 狀態碼是否成功 (200-299 範圍內通常視為成功)
                    if (xhr.status >= 200 && xhr.status < 300) {
                        // 請求成功
                        // 使用 callback 回傳 null (表示沒有錯誤) 和 響應文本

                        var json = xhr.responseText;

                        //var stockData = parseStockData(json);
                        var stockData = JSON.parse(json).data;

                        callback(null, stockData);
                    } else {
                        // 請求失敗 (例如 404 Not Found, 500 Server Error)
                        const error = new Error(`HTTP 請求失敗，狀態碼: ${xhr.status}`);
                        // 使用 callback 回傳 Error 物件 和 null (表示沒有內容)
                        callback(error, null);
                    }
                }
            };

            // 5. 定義網路層次的錯誤處理 (例如，連線中斷、DNS 錯誤等)
            xhr.onerror = function () {
                const error = new Error("網路請求發生錯誤或無法連線到伺服器。");
                callback(error, null);
            };

            // 6. 發送請求
            xhr.send(JSON.stringify(postData));
        }


        function parseStockData(jsonText) {

            var stockData = {};

            var jo = JSON.parse(jsonText);

            var msgArray = jo.msgArray;

            for (var i = 0; i < msgArray.length; i++) {
                var msg = msgArray[i];

                var id = msg.c;             // 代號, Ex: "2330"
                var name = msg.n;           // 名稱, Ex: "台積電"
                var fullName = msg.nf;      // 全名: Ex: "台灣積體電路製造股份有限公司"
                var openPrice = msg.o;      // 開盤價, Ex: 1470.0000
                var previousClosePrice = msg.y;     // 前一日收盤價, Ex: "1460.0000"
                var highPrice = msg.h;      // 當日最高價: Ex: "1485.0000"
                var lowPrice = msg.l;       // 當日最低價: Ex: "1465.0000"
                var currentPrice = msg.z;   // 盤中成交價: Ex: "-" or "1475.0000"  (如果為 - 則應該從 b 取得第一個價格)

                var totalValue = msg.v;     // 累積成交量: Ex: "19367"
                var time = msg.t;           // 報價時間: Ex: "13:24:35"

                var sellPrice = msg.a;      // 揭示賣價: Ex: "1485.0000_1490.0000_1495.0000_1500.0000_1505.0000_"
                var sellValue = msg.f;      // 揭示賣量: Ex: "315_1599_740_523_316_"

                var buyPrice = msg.b;       // 揭示買價: Ex: "1480.0000_1475.0000_1470.0000_1465.0000_1460.0000_"
                var buyValue = msg.g;       // 揭示買價: Ex: "739_931_1180_977_1467_"

                if (typeof (msg.c) == "undefined" || msg.c == "")
                    continue;

                //console.log("msg=" + JSON.stringify(msg));

                // 計算目前價格
                if (typeof (currentPrice) == "undefined" || currentPrice == "-") {
                    // 如果沒有目前價格，則從 BUY 取出價格
                    if (typeof (msg.b) != "undefined") {
                        var v = msg.b.split("_")[0];        // 取出第一個 BUY 價格
                        currentPrice = v;
                    }

                    // 如果連 BUY 也沒有，則從昨天收盤價取出
                    if ((typeof (currentPrice) == "undefined" || currentPrice == "-") && typeof (msg.y) != "undefined") {
                        currentPrice = msg.y;
                    }
                }

                if (typeof (id) == "undefined" || id == "-") id = "";
                if (typeof (name) == "undefined" || name == "-") name = "";
                if (typeof (fullName) == "undefined" || fullName == "-") fullName = "";
                if (typeof (openPrice) == "undefined" || openPrice == "-") openPrice = "";
                if (typeof (previousClosePrice) == "undefined" || previousClosePrice == "-") previousClosePrice = "";
                if (typeof (highPrice) == "undefined" || highPrice == "-") highPrice = "";
                if (typeof (lowPrice) == "undefined" || lowPrice == "-") lowPrice = "";
                if (typeof (currentPrice) == "undefined" || currentPrice == "-") currentPrice = "";
                if (typeof (totalValue) == "undefined" || totalValue == "-") totalValue = "";
                if (typeof (time) == "undefined" || time == "-") time = "";


                var data = {};
                data.id = id;
                data.name = name;
                data.fullName = fullName;
                data.openPrice = openPrice != "" ? parseFloat(openPrice) : openPrice;
                data.previousClosePrice = previousClosePrice != "" ? parseFloat(previousClosePrice) : previousClosePrice;
                data.highPrice = highPrice != "" ? parseFloat(highPrice) : highPrice;
                data.lowPrice = lowPrice != "" ? parseFloat(lowPrice) : lowPrice;
                data.currentPrice = currentPrice != "" ? parseFloat(currentPrice) : currentPrice;
                data.totalValue = totalValue != "" ? parseFloat(totalValue) : totalValue;
                data.time = time;

                stockData[data.id] = data;

                //console.log(data);
            }

            return stockData;
        }





        function fetchUrlContent(url, callback) {
            // 1. 建立 XMLHttpRequest 物件
            const xhr = new XMLHttpRequest();

            // 2. 初始化請求：指定方法為 GET，目標 URL
            xhr.open('GET', url);

            // 3. 設定響應類型 (可選，但有助於某些 API)
            // 這裡我們不設定，讓它預設為文本

            // 4. 定義狀態改變時的回調函數
            xhr.onreadystatechange = function () {
                // 檢查請求是否完成 (readyState === 4)
                if (xhr.readyState === 4) {
                    // 檢查 HTTP 狀態碼是否成功 (200-299 範圍內通常視為成功)
                    if (xhr.status >= 200 && xhr.status < 300) {
                        // 請求成功
                        // 使用 callback 回傳 null (表示沒有錯誤) 和 響應文本
                        callback(null, xhr.responseText);
                    } else {
                        // 請求失敗 (例如 404 Not Found, 500 Server Error)
                        const error = new Error(`HTTP 請求失敗，狀態碼: ${xhr.status}`);
                        // 使用 callback 回傳 Error 物件 和 null (表示沒有內容)
                        callback(error, null);
                    }
                }
            };

            // 5. 定義網路層次的錯誤處理 (例如，連線中斷、DNS 錯誤等)
            xhr.onerror = function () {
                const error = new Error("網路請求發生錯誤或無法連線到伺服器。");
                callback(error, null);
            };

            // 6. 發送請求
            xhr.send();
        }

    </script>


    <!-- Common Function -->
    <script>
        function formatDateTime(dateObj) {
            // 檢查輸入是否為有效的 Date 物件
            if (!(dateObj instanceof Date) || isNaN(dateObj)) {
                return "Invalid Date";
            }

            // 輔助函式：確保數字是兩位數，不足則前面補零
            const padToTwoDigits = (num) => {
                return num.toString().padStart(2, '0');
            };

            // 取得各個日期時間部分
            const year = dateObj.getFullYear();
            // getMonth() 回傳 0-11，所以需要 +1
            const month = padToTwoDigits(dateObj.getMonth() + 1);
            const day = padToTwoDigits(dateObj.getDate());
            const hours = padToTwoDigits(dateObj.getHours());
            const minutes = padToTwoDigits(dateObj.getMinutes());
            const seconds = padToTwoDigits(dateObj.getSeconds());

            // 組合成目標格式字串
            return `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
        }


        function formatTime(dateObj) {
            // 檢查輸入是否為有效的 Date 物件
            if (!(dateObj instanceof Date) || isNaN(dateObj)) {
                return "Invalid Date";
            }

            // 輔助函式：確保數字是兩位數，不足則前面補零
            const padToTwoDigits = (num) => {
                return num.toString().padStart(2, '0');
            };

            // 取得各個日期時間部分
            const year = dateObj.getFullYear();
            // getMonth() 回傳 0-11，所以需要 +1
            const month = padToTwoDigits(dateObj.getMonth() + 1);
            const day = padToTwoDigits(dateObj.getDate());
            const hours = padToTwoDigits(dateObj.getHours());
            const minutes = padToTwoDigits(dateObj.getMinutes());
            const seconds = padToTwoDigits(dateObj.getSeconds());

            // 組合成 09:26:15 格式字串
            return `${hours}:${minutes}:${seconds}`;
        }


        function formatTimeHHMM(dateObj) {
            // 檢查輸入是否為有效的 Date 物件
            if (!(dateObj instanceof Date) || isNaN(dateObj)) {
                return "Invalid Date";
            }

            // 輔助函式：確保數字是兩位數，不足則前面補零
            const padToTwoDigits = (num) => {

            };

            // 取得各個日期時間部分
            const year = dateObj.getFullYear();
            // getMonth() 回傳 0-11，所以需要 +1
            const month = padToTwoDigits(dateObj.getMonth() + 1);
            const day = padToTwoDigits(dateObj.getDate());
            const hours = padToTwoDigits(dateObj.getHours());
            const minutes = padToTwoDigits(dateObj.getMinutes());
            const seconds = padToTwoDigits(dateObj.getSeconds());

            // 組合成 09:26:15 格式字串

        }





        function calculateTimeDifference(date1, date2) {
            // 1. 檢查輸入是否為有效的 Date 物件
            if (!(date1 instanceof Date) || isNaN(date1) || !(date2 instanceof Date) || isNaN(date2)) {
                return "Invalid Input";
            }

            // 2. 計算毫秒差 (使用 Math.abs 確保結果為正數，代表絕對時間差)
            const diffInMilliseconds = Math.abs(date1.getTime() - date2.getTime());

            // 3. 轉換為總秒數
            // 1000 毫秒 = 1 秒
            const totalSeconds = Math.floor(diffInMilliseconds / 1000);

            // 4. 進行時、分、秒的計算
            const seconds = totalSeconds % 60;
            const totalMinutes = Math.floor(totalSeconds / 60);
            const minutes = totalMinutes % 60;
            const hours = Math.floor(totalMinutes / 60); // 小時數可能會超過 24

            // 5. 輔助函式：確保數字是兩位數，不足則前面補零
            const padToTwoDigits = (num) => {
                return num.toString().padStart(2, '0');
            };

            // 6. 組合並輸出格式字串
            // 注意：小時數 (hours) 雖然在 HH:mm:ss 格式中，但如果時間差超過 24 小時，它會顯示超過 24 的數字。
            // 例如：50 小時 00 分 00 秒 => "50:00:00"
            return `${padToTwoDigits(hours)}:${padToTwoDigits(minutes)}:${padToTwoDigits(seconds)}`;
        }



        let audioCtx = null;

        function startNonSilentAudio() {
            if (!window.AudioContext && !window.webkitAudioContext) return;

            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // 1. 建立一個振盪器 (OscillatorNode) 來生成聲音
                const oscillator = audioCtx.createOscillator();
                // 🚨 修正點：使用一個極低頻率 (例如 20 Hz)，人耳通常難以察覺
                oscillator.type = 'sine'; // 正弦波
                oscillator.frequency.setValueAtTime(20, audioCtx.currentTime);

                // 2. 建立增益節點 (Gain Node) 來控制音量
                const gainNode = audioCtx.createGain();
                // 🚨 修正點：維持一個極低但非零的音量 (0.005 或 0.01)
                gainNode.gain.setValueAtTime(0.005, audioCtx.currentTime);

                // 3. 連接節點: 振盪器 -> 增益 -> 目的地
                oscillator.connect(gainNode).connect(audioCtx.destination);

                // 4. 開始播放
                oscillator.start(0);

                console.log("非靜音音頻 (20Hz) 已啟動，嘗試防止計時器節流。");
            }

            // 在使用者互動時，確保 Context 狀態為 running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    console.log("AudioContext 已從 suspended 狀態恢復 (resume)。");
                }).catch(err => {
                    console.error("AudioContext 恢復失敗:", err);
                });
            }
        }

        function stopBackgroundTasks() {                
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
                console.log("背景音頻已停止並釋放資源。");
            }
        }
    </script>
